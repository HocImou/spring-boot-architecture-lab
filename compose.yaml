
services:
  postgres:
    image: postgres:18
    container_name: architecture-lab-postgres
    environment:
      POSTGRES_DB: architecture_lab
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d architecture_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
